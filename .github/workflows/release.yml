name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: Retry the current main commit after its push CI has passed
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: omabox-release
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      should_release: ${{ steps.release.outputs.should_release }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      ci_run_id: ${{ steps.release.outputs.ci_run_id }}
      plan: ${{ steps.release.outputs.plan }}
      build: ${{ steps.release.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Select the tested main commit and next stable version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/release_automation.py plan --event "$GITHUB_EVENT_PATH" --output "$RUNNER_TEMP/release-plan.json"
          printf 'plan=%s\n' "$(jq -c . "$RUNNER_TEMP/release-plan.json")" >> "$GITHUB_OUTPUT"
          printf 'build=%s\n' "$((10 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  archive:
    needs: validate
    if: needs.validate.outputs.should_release == 'true'
    runs-on: macos-26
    timeout-minutes: 180
    env:
      OMABOX_VERSION: ${{ needs.validate.outputs.version }}
      OMABOX_BUILD_NUMBER: ${{ needs.validate.outputs.build }}
      OMABOX_TEAM_ID: ${{ vars.OMABOX_TEAM_ID || '4538W4A79B' }}
      OMABOX_SIGNING_IDENTITY: ${{ vars.OMABOX_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - name: Reserve space for the bundled factory
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$(uname -m)" == arm64 ]]
          [[ "$(sw_vers -productVersion)" == 26.* ]]
          : "${OMABOX_SIGNING_IDENTITY:?Set OMABOX_SIGNING_IDENTITY to the Developer ID Application identity.}"
          printf 'OMABOX_ARCHIVE_PATH=%s\nOMABOX_EXPORT_PATH=%s\nOMABOX_RELEASE_PATH=%s\nOMABOX_DERIVED_DATA_PATH=%s\n' \
            "$RUNNER_TEMP/Omabox-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.xcarchive" \
            "$RUNNER_TEMP/Omabox-export-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/Omabox-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            "$RUNNER_TEMP/Omabox-derived-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import shutil
          root = Path.home()
          for path in [root / 'Library/Android/sdk', root / 'Library/Caches/Homebrew']:
              if path.is_dir() and not path.is_symlink():
                  shutil.rmtree(path)
          manifest = json.loads(Path('Guest/prepared-release.json').read_text())
          guest_bytes = sum(item['byteCount'] for item in manifest['guest']['integrity'].values())
          required = guest_bytes * 3 + 6 * 1024**3
          available = shutil.disk_usage('.').free
          print(f'Release disk budget: {available / 1024**3:.1f} GiB available; {required / 1024**3:.1f} GiB required.')
          if available < required:
              raise SystemExit('The hosted runner does not have enough free space for verified archive, export, and packaging.')
          PY
          xcodebuild -version
          df -h .
      - name: Install pinned Tuist
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c
        with:
          version: '2026.9.5'
          sha256: 6274b68122a837c514374e96dabb18a9e3562bdd28528b4b3feea9d8eb615d98
          tool_versions: |
            tuist 4.207.0
          cache: false
      - name: Fetch and verify the pinned factory guest
        run: python3 Scripts/fetch-release-guest.py
      - name: Import temporary signing and notarization credentials
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: bash Scripts/release-keychain.sh setup
      - name: Archive the tested commit
        run: bash Scripts/archive.sh
      - name: Reclaim verified archive inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OMABOX_DERIVED_DATA_PATH" == "$RUNNER_TEMP"/Omabox-derived-* ]]
          rm -rf -- "$GITHUB_WORKSPACE/Omabox/Resources/Guest" "$OMABOX_DERIVED_DATA_PATH"
          df -h .
      - name: Export Developer ID app
        run: bash Scripts/export.sh
      - name: Reclaim the exported archive
        shell: bash
        run: |
          set -euo pipefail
          [[ "$OMABOX_ARCHIVE_PATH" == "$RUNNER_TEMP"/Omabox-*.xcarchive ]]
          rm -rf -- "$OMABOX_ARCHIVE_PATH"
          df -h .
      - name: Notarize, staple, and verify the disk image
        run: bash Scripts/package-release.sh
      - name: Verify release metadata and record tested source
        env:
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          CI_RUN_ID: ${{ needs.validate.outputs.ci_run_id }}
        run: >-
          python3 Scripts/release_automation.py verify
          --directory "$OMABOX_RELEASE_PATH"
          --version "$OMABOX_VERSION"
          --build "$OMABOX_BUILD_NUMBER"
          --commit "$RELEASE_COMMIT"
          --ci-run "$CI_RUN_ID"
          --team "$OMABOX_TEAM_ID"
      - name: Preserve verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Omabox-release
          path: |
            ${{ env.OMABOX_RELEASE_PATH }}/*.dmg
            ${{ env.OMABOX_RELEASE_PATH }}/SHA256SUMS
            ${{ env.OMABOX_RELEASE_PATH }}/release-manifest.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Preserve notarization diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Omabox-release-diagnostics
          path: |
            ${{ env.OMABOX_RELEASE_PATH }}/*-notarization.json
            ${{ env.OMABOX_RELEASE_PATH }}/release-manifest.json
            ${{ env.OMABOX_RELEASE_PATH }}/STAGING_MOUNTED.txt
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove temporary signing credentials
        if: always()
        run: bash Scripts/release-keychain.sh cleanup
      - name: Remove this attempt’s temporary products
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for output in "${OMABOX_ARCHIVE_PATH:-}" "${OMABOX_EXPORT_PATH:-}" "${OMABOX_RELEASE_PATH:-}" "${OMABOX_DERIVED_DATA_PATH:-}"; do
            [[ -n "$output" ]] || continue
            [[ "$output" == "$RUNNER_TEMP"/Omabox-* ]] || exit 1
            if [[ -f "$output/STAGING_MOUNTED.txt" ]]; then
              echo "Retaining mounted verification image: $output"
              continue
            fi
            rm -rf -- "$output" "$output.lock"
          done

  publish:
    needs: [validate, archive]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      OMABOX_TEAM_ID: ${{ vars.OMABOX_TEAM_ID || '4538W4A79B' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: Omabox-release
          path: release
      - name: Publish the verified release if main is still current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PLAN: ${{ needs.validate.outputs.plan }}
          RELEASE_BUILD: ${{ needs.validate.outputs.build }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          Path(os.environ['RUNNER_TEMP'], 'release-plan.json').write_text(json.dumps(json.loads(os.environ['RELEASE_PLAN'])))
          PY
          python3 Scripts/release_automation.py publish --directory release --plan "$RUNNER_TEMP/release-plan.json" --build "$RELEASE_BUILD" --team "$OMABOX_TEAM_ID"
